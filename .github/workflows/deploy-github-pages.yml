name: Deploy to Vercel

on:
  workflow_call:
    outputs:
      url:
        value: ${{ jobs.deploy.outputs.page_url }}
        description: "The URL of the deployed page"

  workflow_dispatch: {}

jobs:
  build-webgl:
    uses: ./.github/workflows/build-unity.yml
    secrets: inherit
    with:
      build_target_name: For_GitHub_Pages

  deploy:
    runs-on: ubuntu-latest
    needs: build-webgl
    outputs:
      page_url: ${{ steps.vercel.outputs.preview-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Unity Build Artifact
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./dist
          vercel-args: '--prod'

  notify:
    needs: deploy
    name: Notify Discord on Complete
    uses: ./.github/workflows/discord-notifier.yml
    if: always()
    secrets: inherit
    with:
      title: "🚀 Vercel Deployment"
      message: |
        **リポジトリ:** ${{ github.repository }}
        **結果:** **${{ needs.deploy.result }}**
      status: ${{ needs.deploy.result }}
      target_url: ${{ needs.deploy.outputs.page_url }}
